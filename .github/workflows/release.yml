name: Build Windows release
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'assets/**'
      - 'test/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Windows Electron integration check
        run: npm run test:electron
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem src -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package installer and portable executable
        run: npm run dist -- --publish never
      - name: Verify packaged version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $setup = "dist/TransparentCalendar-Setup-$version.exe"
          if (!(Test-Path $setup) -or !(Test-Path 'dist/TransparentCalendar.exe')) { throw 'Missing Windows executable' }
          $fileVersion = (Get-Item 'dist/win-unpacked/TransparentCalendar.exe').VersionInfo.ProductVersion
          if (!$fileVersion.StartsWith($version)) { throw "Wrong executable version: $fileVersion" }
          Get-ChildItem dist -Filter *.exe | ForEach-Object { if ($_.Length -lt 1MB) { throw 'Invalid executable size' } }
          Get-ChildItem dist -Filter *.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-executables
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to replace published binaries" }
          gh release create $tag --target $env:GITHUB_SHA --title $tag --notes-file RELEASE_NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag "dist/TransparentCalendar-Setup-$version.exe" 'dist/TransparentCalendar.exe' 'dist/SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
