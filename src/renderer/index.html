<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title>透明日历</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="card">
      <header class="drag">
        <div class="month-nav drag">
          <button id="btnPrev" class="icon-btn no-drag" title="上一月">
            &#x2039;
          </button>
          <span id="monthTitle" class="title"></span>
          <button id="btnNext" class="icon-btn no-drag" title="下一月">
            &#x203A;
          </button>
          <button id="btnToday" class="text-btn no-drag" title="回到今天">
            今
          </button>
        </div>
        <div class="header-actions no-drag">
          <button
            id="btnViewMode"
            class="text-btn"
            title="缩减为当周"
            aria-label="缩减为当周"
            aria-pressed="false"
          >
            周
          </button>
          <span id="authDot" class="dot" title="未连接 Outlook"></span>
          <button id="btnSettings" class="icon-btn" title="设置">
            &#x2699;
          </button>
          <button id="btnHide" class="icon-btn" title="隐藏到托盘">
            &#x2013;
          </button>
        </div>
      </header>

      <div id="calendarPane">
        <div id="weekRow" class="week-row"></div>
        <div id="grid" class="grid" role="group" aria-label="日期"></div>
      </div>
      <div id="agendaPane">
        <section id="eventPanel">
          <div class="day-label-row">
            <div id="dayLabel" class="day-label"></div>
            <button
              id="btnAddEvent"
              class="text-btn no-drag"
              title="添加本地日程"
            >
              +
            </button>
          </div>
          <ul id="eventList" class="event-list"></ul>
          <div id="addEventBar" class="add-bar hidden">
            <input id="addEventInput" type="text" placeholder="标题" />
            <input id="addEventStart" type="datetime-local" />
            <input id="addEventEnd" type="datetime-local" />
            <button id="btnAddEventConfirm" class="text-btn">添加</button>
            <button id="btnAddEventCancel" class="text-btn">取消</button>
          </div>
        </section>

        <section id="todoPanel" class="todo-panel hidden">
          <div class="todo-header no-drag">
            <span id="todoLabel" class="day-label">待办任务</span>
            <button
              id="btnToggleDone"
              class="text-btn done-toggle"
              title="显示/隐藏已完成"
            >
              ✔
            </button>
            <button id="btnAddTodo" class="text-btn add-btn" title="添加任务">
              +
            </button>
          </div>
          <ul id="todoList" class="event-list"></ul>
          <div id="addTodoBar" class="add-bar hidden">
            <input id="todoInput" type="text" placeholder="任务标题" />
            <input id="todoDueDate" type="date" />
            <button id="btnAddTodoConfirm" class="text-btn">添加</button>
            <button id="btnAddTodoCancel" class="text-btn">取消</button>
          </div>
        </section>
      </div>
      <footer class="footer no-drag">
        <span id="statusText" class="status"></span>
        <button id="btnRefresh" class="text-btn" title="刷新">&#x21bb;</button>
      </footer>
    </div>

    <div
      id="detailOverlay"
      class="overlay detail-overlay hidden no-drag"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailHeading"
    >
      <h3 id="detailHeading">详情</h3>
      <form id="detailForm">
        <fieldset id="detailFields" disabled>
          <label class="field"
            ><span>标题</span
            ><input id="detailSubject" type="text" required maxlength="500"
          /></label>
          <div id="detailEventFields">
            <label class="check-field"
              ><input id="detailAllDay" type="checkbox" />全天</label
            >
            <label class="field"
              ><span>开始</span
              ><input id="detailStart" type="datetime-local" required
            /></label>
            <label class="field"
              ><span id="detailEndLabel">结束</span
              ><input id="detailEnd" type="datetime-local" required
            /></label>
            <label class="field"
              ><span>地点</span
              ><input id="detailLocation" type="text" maxlength="500"
            /></label>
          </div>
          <div id="detailTaskFields">
            <label class="field"
              ><span>截止日期（留空表示无截止日）</span
              ><input id="detailDue" type="date"
            /></label>
            <label class="field"
              ><span>优先级</span
              ><select id="detailImportance">
                <option value="low">低</option>
                <option value="normal">普通</option>
                <option value="high">高</option>
              </select></label
            >
            <label class="field"
              ><span>状态</span
              ><select id="detailStatus">
                <option value="notStarted">未开始</option>
                <option value="inProgress">进行中</option>
                <option value="completed">已完成</option>
                <option value="waitingOnOthers">等待他人</option>
                <option value="deferred">已推迟</option>
              </select></label
            >
          </div>
          <label class="field"
            ><span>备注</span
            ><textarea id="detailNotes" rows="3" maxlength="10000"></textarea>
          </label>
        </fieldset>
        <p id="detailError" class="err hidden" role="alert"></p>
        <div class="overlay-actions">
          <button id="btnDetailExternal" type="button" class="text-btn hidden">
            打开原日历
          </button>
          <button id="btnDetailClose" type="button" class="text-btn">
            关闭
          </button>
          <button id="btnDetailEdit" type="button" class="primary-btn">
            编辑
          </button>
          <button id="btnDetailSave" type="submit" class="primary-btn hidden">
            保存
          </button>
        </div>
      </form>
    </div>
    <div id="resizeGrips" aria-hidden="true"></div>
    <script src="appearance.js"></script>
    <script src="calendar-view.js"></script>
    <script src="mouse-interaction.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
