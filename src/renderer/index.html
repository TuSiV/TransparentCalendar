<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title>透明日历</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="card">
      <header class="drag">
        <div class="month-nav drag">
          <button id="btnPrev" class="icon-btn no-drag" title="上一月">
            &#x2039;
          </button>
          <span id="monthTitle" class="title"></span>
          <button id="btnNext" class="icon-btn no-drag" title="下一月">
            &#x203A;
          </button>
          <button id="btnToday" class="text-btn no-drag" title="回到今天">
            今
          </button>
        </div>
        <div class="header-actions no-drag">
          <button
            id="btnViewMode"
            class="text-btn"
            title="缩减为当周"
            aria-label="缩减为当周"
            aria-pressed="false"
          >
            周
          </button>
          <span id="authDot" class="dot" title="未连接 Outlook"></span>
          <button id="btnSettings" class="icon-btn" title="设置">
            &#x2699;
          </button>
          <button id="btnHide" class="icon-btn" title="隐藏到托盘">
            &#x2013;
          </button>
        </div>
      </header>

      <div id="calendarPane">
        <div id="weekRow" class="week-row"></div>
        <div id="grid" class="grid" role="group" aria-label="日期"></div>
      </div>
      <div id="agendaPane">
        <section id="eventPanel">
          <div class="day-label-row">
            <div id="dayLabel" class="day-label"></div>
            <button
              id="btnAddEvent"
              class="text-btn no-drag"
              title="添加本地日程"
            >
              +
            </button>
          </div>
          <ul id="eventList" class="event-list"></ul>
        </section>

        <section id="todoPanel" class="todo-panel hidden">
          <div class="todo-header no-drag">
            <span id="todoLabel" class="day-label">待办任务</span>
            <button
              id="btnToggleDone"
              class="text-btn done-toggle"
              title="显示/隐藏已完成"
            >
              ✔
            </button>
            <button id="btnAddTodo" class="text-btn add-btn" title="添加任务">
              +
            </button>
          </div>
          <ul id="todoList" class="event-list"></ul>
        </section>
      </div>
      <footer class="footer no-drag">
        <span id="statusText" class="status"></span>
        <button id="btnRefresh" class="text-btn" title="刷新">&#x21bb;</button>
      </footer>
    </div>

    <div id="resizeGrips" aria-hidden="true"></div>
    <script src="appearance.js"></script>
    <script src="calendar-view.js"></script>
    <script src="mouse-interaction.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
